[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gems-workbench"
version = "0.1.0"
description = "Metric, submission validator/writer and holdout splits for the DOE GEMS Prize (DrivenData #306)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "rasterio>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
