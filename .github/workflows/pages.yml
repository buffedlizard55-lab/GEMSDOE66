name: Deploy project site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/audit_site.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/verify-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify fail-closed site
        run: python scripts/audit_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build Markdown and static pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
