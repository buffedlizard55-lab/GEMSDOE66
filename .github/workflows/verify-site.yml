name: Verify project site

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/audit_site.py'
      - '.github/workflows/verify-site.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/audit_site.py'
      - '.github/workflows/verify-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Audit fail-closed site and evidence card
        run: python scripts/audit_site.py
