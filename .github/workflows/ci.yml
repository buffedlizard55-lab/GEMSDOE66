name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Unit tests (no competition data needed)
        run: pytest -q
      - name: Site build is in sync with docs/data
        run: |
          python scripts/build_site.py
          git diff --exit-code -- docs/ || (echo "docs/ is out of date: run scripts/build_site.py and commit" && exit 1)
